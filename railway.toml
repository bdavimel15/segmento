[build]
builder = "NIXPACKS"

[deploy]
preDeployCommand = "php artisan migrate --force && php artisan db:seed --class=SegmentoClienteCampoSeeder --force && php artisan db:seed --class=SegmentoPresetSeeder --force"

startCommand = "php artisan serve --host=0.0.0.0 --port=$PORT"

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10